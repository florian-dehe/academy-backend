name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
          POSTGRES_DB: academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://academy:academy@localhost:5432/academy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          test -z "$(git status --porcelain -- 'internal/*/store')" || { git status --short -- 'internal/*/store'; echo 'run make sqlc and commit'; exit 1; }
      - run: go vet ./...
      - run: go test ./... -race -count=1
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test ./... -race -count=1
