openapi: 3.0.3
info:
  title: Remojii Academy API
  version: 0.1.0
  description: |
    Academy backend (identity and intro test so far). /v1/me (POST, GET, DELETE),
    /v1/intro-test/result and /v1/me/personality-result are real;
    /v1/users still answers 501 not_implemented; request/response schemas are
    added as handlers are built. Keep this file and internal/app/routes.go in sync.
    Required role is also exposed per operation as `x-min-role`
    (admin includes content_editor includes learner).
servers:
  - url: /
tags:
  - {name: ops}
  - {name: identity}
  - {name: introtest}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum access token issued by the Laravel app; validated by calling Laravel's current-user endpoint.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: {type: string, example: not_implemented}
            message: {type: string}
    User:
      type: object
      required: [id, role, email, display_name]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [learner, content_editor, admin]}
        email: {type: string}
        display_name: {type: string, nullable: true}
    PersonalityScores:
      type: object
      required: [openness, conscientiousness, extraversion, agreeableness, neuroticism]
      additionalProperties: false
      properties:
        openness: &score {type: number, format: double, minimum: 1, maximum: 5}
        conscientiousness: *score
        extraversion: *score
        agreeableness: *score
        neuroticism: *score
    PersonalityResult:
      allOf:
        - {$ref: '#/components/schemas/PersonalityScores'}
        - type: object
          required: [id, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
  responses:
    NotImplemented:
      description: Route not built yet.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: Missing or invalid bearer token.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Authenticated but not allowed (role too low, or no Academy user yet with code user_required).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Laravel could not validate the token (code upstream_unavailable). Do not force a re-login.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      x-min-role: none
      security: []
      responses:
        '200': {description: Process is up.}
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      x-min-role: none
      security: []
      responses:
        '200': {description: Dependencies reachable.}
        '503': {description: Dependency unavailable.}
  /v1/me:
    post:
      operationId: postMe
      tags: [identity]
      x-min-role: authenticated
      security: [{bearerAuth: []}]
      description: |
        Create the Academy user for the Laravel user behind the token.
        The body id must equal the token's Laravel user id (else 403 forbidden).
        Idempotent: 201 on first call, 200 with the stored user afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              additionalProperties: false
              properties:
                user_id: {type: string}
      responses:
        '201': {description: User created., content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '200': {description: User already existed., content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid body.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Email already used by another user.}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: getMe
      tags: [identity]
      x-min-role: learner
      security: [{bearerAuth: []}]
      description: Current user.
      responses:
        '200': {description: The user., content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteMe
      tags: [identity]
      x-min-role: learner
      security: [{bearerAuth: []}]
      description: |
        Delete the Academy user and their Academy data. The Laravel account is
        untouched; POST /v1/me creates a fresh Academy user afterwards.
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/intro-test/result:
    post:
      operationId: postIntroTestResult
      tags: [introtest]
      x-min-role: learner
      security: [{bearerAuth: []}]
      description: |
        Store the caller's intro test result. The frontend asks the 30 questions
        and computes the five axis scores (1.0..5.0); answers are not sent or
        stored. A retake adds a new result, and the newest one is current.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonalityScores'}
      responses:
        '201': {description: Stored., content: {application/json: {schema: {$ref: '#/components/schemas/PersonalityResult'}}}}
        '400': {description: A score is missing, not a number or outside 1.0..5.0, or the body has unknown fields.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/me/personality-result:
    get:
      operationId: getMePersonalityResult
      tags: [introtest]
      x-min-role: learner
      security: [{bearerAuth: []}]
      description: The caller's latest intro test result.
      responses:
        '200': {description: The latest result., content: {application/json: {schema: {$ref: '#/components/schemas/PersonalityResult'}}}}
        '404': {description: The caller has not submitted a result yet.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/users:
    get:
      operationId: getUsers
      tags: [identity]
      x-min-role: admin
      security: [{bearerAuth: []}]
      description: 'Search users (email, role, subscription status)'
      responses:
        '501': {$ref: '#/components/responses/NotImplemented'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/users/{userId}/role:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: patchUsersUseridRole
      tags: [identity]
      x-min-role: admin
      security: [{bearerAuth: []}]
      description: 'Set role (learner / content_editor / admin)'
      responses:
        '501': {$ref: '#/components/responses/NotImplemented'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
